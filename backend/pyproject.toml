[project]
name = "personal-test-data-generator-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "mariadb>=1.1.14",
  "pydantic-settings>=2.6,<3",
  "python-dotenv>=1.2.4",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "bandit>=1.8",
    "httpx2>=2.13.1",
    "mypy>=1.13",
    "pytest>=8.4.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.8",
]

# Static analysis -------------------------------------------------------------

[tool.ruff]
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, B bugbear, UP pyupgrade,
# C90 complexity, S bandit-style security rules
select = ["E", "F", "W", "I", "B", "UP", "C90", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311"]                # assert and seeded Random are fine in tests
"app/models/phone_prefixes.py" = ["E501"]    # long data table

[tool.bandit]
exclude_dirs = [".venv", "tests"]

[tool.mypy]
files = ["app"]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["mariadb", "mariadb.*"]
ignore_missing_imports = true

# Coverage --------------------------------------------------------------------

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true

