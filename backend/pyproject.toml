[project]
name = "personal-test-data-generator-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "mariadb>=1.1.14",
  "pydantic-settings>=2.6,<3",
  "python-dotenv>=1.2.4",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8.4.2",
]
