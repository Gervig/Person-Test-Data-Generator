
services:
  mariadb:
    image: mariadb:11
    container_name: test-data-mariadb
    restart: "no"
    environment:
      MARIADB_ROOT_PASSWORD: local_dev_password
      MARIADB_DATABASE: addresses
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data:
